name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      # Baseline specs and the end-to-end CLI run create git repositories; a fake registry listens on 127.0.0.1.
      - run: pnpm test
      # Consumer matrix: the packed package in CJS/ESM projects and the installed CLI on real lock files.
      - run: pnpm run test:consumers
      - run: pnpm run build
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-report
          path: .jest-report.json
          if-no-files-found: ignore
          retention-days: 7
